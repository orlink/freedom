<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freedom Map</title>
  <meta name="description" content="How free are people at each level of community, from the individual to the union, to govern their own shared interests?">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/scale.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><h1><a href="./">Freedom Map</a></h1><nav class="menu"><a href="what-is-freedom.html">What is freedom</a></nav>
      <div class="scale" id="scale" role="group" aria-label="Chip colours"><button type="button" data-scale="grey" aria-pressed="true">Grey</button><button type="button" data-scale="red" aria-pressed="false">Red</button></div></div>
    <form id="search" class="search" role="search">
      <input id="q" type="search" placeholder="Search an address or place…" aria-label="Address or place" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>

  <main class="page">
    <div id="map" aria-label="Map. Click anywhere to choose a location."></div>
    <div class="examples">
      <button type="button" data-lat="42.6745" data-lon="23.3263">Lozenets, Sofia</button>
      <button type="button" data-lat="42.5867" data-lon="23.3605">Bistritsa</button>
      <button type="button" data-lat="47.3779" data-lon="8.5281">Langstrasse, Zürich</button>
      <button type="button" data-lat="53.3256" data-lon="-6.2564">Ranelagh, Dublin</button>
    </div>
    <div id="place" class="place" aria-live="polite"></div>
    <p id="hint" class="hint">Search for an address or click on the map.</p>
    <nav id="trail" class="trail" aria-label="Where you are"></nav>
    <nav id="tree" class="tree" aria-label="Freedom tree"></nav>
  </main>

  <footer class="foot">
    <p class="legend" id="legend"></p>
    <p id="status"></p>
    <p>Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Geocoding by <a href="https://nominatim.org/">Nominatim</a> · <a href="docs/DATA.md">About the data</a></p>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
