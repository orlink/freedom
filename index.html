<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freedom Map</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <meta name="description" content="How free are people at each level of community, from the individual to the union, to govern their own shared interests?">

  <link rel="stylesheet" href="css/style.css">
  <script src="js/scale.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><h1><a href="./"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="logo-tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2555a"/><stop offset="1" stop-color="#d6334f"/></linearGradient><clipPath id="logo-clip"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath></defs><rect x="2" y="2" width="60" height="60" rx="15" fill="url(#logo-tile)"/><g clip-path="url(#logo-clip)"><g transform="rotate(-40 32 32)"><g transform="translate(-7.5 0) rotate(-15 11 32)"><defs><clipPath id="logo-c0"><polygon points="-168,-8 36.5,-8 36.5,18.25 33.5,20.75 34,23.25 31.5,25.75 32,38.25 32.5,40.75 29,43.25 29.5,45.75 29.5,72 -168,72"/></clipPath></defs><g clip-path="url(#logo-c0)"><path d="M74 22 H21 A10 10 0 0 0 21 42 H74" fill="none" stroke="#fff" stroke-width="6.5"/></g></g><g transform="translate(7.5 0) rotate(15 53 32)"><defs><clipPath id="logo-c1"><polygon points="232,-8 36.5,-8 36.5,18.25 33.5,20.75 34,23.25 31.5,25.75 32,38.25 32.5,40.75 29,43.25 29.5,45.75 29.5,72 232,72"/></clipPath></defs><g clip-path="url(#logo-c1)"><path d="M-10 22 H43 A10 10 0 0 1 43 42 H-10" fill="none" stroke="#fff" stroke-width="6.5"/></g></g></g></g></svg>Freedom Map</a></h1><nav class="menu"><a href="what-is-freedom.html">What is freedom</a></nav>
      <div class="scale" id="scale" role="group" aria-label="Chip colours"><button type="button" data-scale="grey" aria-pressed="true">Grey</button><button type="button" data-scale="red" aria-pressed="false">Red</button></div></div>
    <form id="search" class="search" role="search">
      <input id="q" type="search" placeholder="Search an address or place…" aria-label="Address or place" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>

  <main class="page">
    <div id="map" aria-label="Map. Click anywhere to choose a location."></div>
    <div class="examples">
      <button type="button" data-lat="42.6745" data-lon="23.3263">Lozenets, Sofia</button>
      <button type="button" data-lat="42.5867" data-lon="23.3605">Bistritsa</button>
      <button type="button" data-lat="47.3779" data-lon="8.5281">Langstrasse, Zürich</button>
      <button type="button" data-lat="53.3256" data-lon="-6.2564">Ranelagh, Dublin</button>
    </div>
    <div id="place" class="place" aria-live="polite"></div>
    <p id="hint" class="hint">Search for an address or click on the map.</p>
    <nav id="trail" class="trail" aria-label="Where you are"></nav>
    <nav id="tree" class="tree" aria-label="Freedom tree"></nav>
  </main>

  <footer class="foot">
    <p class="legend" id="legend"></p>
    <p id="status"></p>

  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
